name: Test Azure Login & Signing Access

on:
  push:
    branches:
      - azure-signing
  workflow_dispatch:

jobs:
  test-azure:
    name: Test Azure Access
    runs-on: windows-latest
    steps:
      - name: Debug Context Variables (Windows/PowerShell)
        run: |
          # In PowerShell, env variables use the $env:Name syntax
          # The .Substring(start, length) method safely isolates characters
          Write-Output "Target Tenant ID starts with: $($env:ENV_TENANT.Substring(0,5))..."
          Write-Output "Target Subscription ID starts with: $($env:ENV_SUB.Substring(0,5))..."
          Write-Output "Target Client ID starts with: $($env:ENV_CLIENT.Substring(0,5))..."
          Write-Output "Target Client Secret starts with: $($env:ENV_CLIENT_SECRET.Substring(0,5))..."
          Write-Output "Target Signing Account Name starts with: $($env:ENV_SIGNING_ACCOUNT_NAME.Substring(0,5))..."
          Write-Output "Target Certificate Profile Name starts with: $($env:ENV_CERTIFICATE_PROFILE_NAME.Substring(0,5))..."
        env:
          ENV_TENANT: ${{ secrets.AZURE_TENANT_ID }}
          ENV_SUB: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ENV_CLIENT: ${{ secrets.AZURE_CLIENT_ID }}
          ENV_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          ENV_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          ENV_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
      
      - name: Validate Azure Code Signing Secrets
        shell: pwsh
        run: |
          $missing = @()
          if ([string]::IsNullOrWhiteSpace('${{ secrets.AZURE_CLIENT_ID }}')) { $missing += "AZURE_CLIENT_ID" }
          if ([string]::IsNullOrWhiteSpace('${{ secrets.AZURE_CLIENT_SECRET }}')) { $missing += "AZURE_CLIENT_SECRET" }
          if ([string]::IsNullOrWhiteSpace('${{ secrets.AZURE_TENANT_ID }}')) { $missing += "AZURE_TENANT_ID" }
          if ([string]::IsNullOrWhiteSpace('${{ secrets.AZURE_SUBSCRIPTION_ID }}')) { $missing += "AZURE_SUBSCRIPTION_ID" }
          if ([string]::IsNullOrWhiteSpace('${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}')) { $missing += "AZURE_SIGNING_ACCOUNT_NAME" }
          if ([string]::IsNullOrWhiteSpace('${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}')) { $missing += "AZURE_CERTIFICATE_PROFILE_NAME" }
          
          if ($missing.Count -gt 0) {
            Write-Error "Required Azure Code Signing secret(s) missing: $($missing -join ', ')"
            exit 1
          } else {
            Write-Host "All required Azure secrets are populated!"
          }

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Verify Azure CLI Access
        shell: pwsh
        run: |
          Write-Host "Successfully logged in to Azure! Verifying active subscription info..."
          az account show --output json

      - name: Create Sample Windows Binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\test_bin"
          Copy-Item "C:\Windows\System32\notepad.exe" "${{ github.workspace }}\test_bin\testapp.exe"
          Copy-Item "C:\Windows\System32\kernel32.dll" "${{ github.workspace }}\test_bin\testlib.dll"
          Write-Host "Staged test executable and DLL in ${{ github.workspace }}\test_bin"

      - name: Sign Windows Binaries (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\test_bin
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Verify Signed Windows Binaries
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path "${{ github.workspace }}\test_bin" -Recurse -Include *.exe,*.dll
          $failed = $false
          foreach ($file in $files) {
            Write-Host "Verifying $($file.FullName)..."
            $sig = Get-AuthenticodeSignature -FilePath $file.FullName
            Write-Host "  Status: $($sig.Status)"
            Write-Host "  StatusMessage: $($sig.StatusMessage)"
            if ($sig.SignerCertificate) {
              Write-Host "  Subject: $($sig.SignerCertificate.Subject)"
              Write-Host "  Issuer: $($sig.SignerCertificate.Issuer)"
            }
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature status for $($file.Name) is invalid: $($sig.Status)"
              $failed = $true
            }
          }
          if ($failed) {
            exit 1
          }
