name: Build OpenSSL
run-name: Build OpenSSL ${{ inputs.version }} via ${{ github.event_name }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenSSL Version or Branch (e.g. 3.6.2, master)'
        required: true
        type: string
        default: ''
      build_type:
        description: 'Build Source'
        required: true
        type: choice
        options:
          - release
          - branch
        default: release
      sign_binaries:
        description: 'Sign Windows binaries & installers (Azure Trusted Signing)'
        required: false
        type: boolean
        default: false
      build_installers:
        description: 'Build Windows Installers (InnoSetup EXE, MSIX, WiX MSI)'
        required: false
        type: boolean
        default: false
      build_windows:
        description: 'Target: Windows (x64, x86, ARM64/ARM64X)'
        required: false
        type: boolean
        default: true
      build_linux:
        description: 'Target: Linux (x64, arm64)'
        required: false
        type: boolean
        default: true
      build_macos:
        description: 'Target: macOS Universal (x86_64 + arm64)'
        required: false
        type: boolean
        default: true
      build_android:
        description: 'Target: Android (arm64, arm)'
        required: false
        type: boolean
        default: true
      build_ios:
        description: 'Target: iOS (arm64, sim-arm64)'
        required: false
        type: boolean
        default: true
      ignore_eol:
        description: 'Ignore EOL Check'
        required: false
        type: boolean
        default: false
      keep_raw_artifacts:
        description: 'Keep raw build artifacts'
        required: false
        type: boolean
        default: false

  workflow_call:
    inputs:
      version:
        required: true
        type: string
      build_type:
        required: false
        type: string
        default: release
      sign_binaries:
        required: false
        type: boolean
        default: false
      build_installers:
        required: false
        type: boolean
        default: false
      build_windows:
        required: false
        type: boolean
        default: true
      build_linux:
        required: false
        type: boolean
        default: true
      build_macos:
        required: false
        type: boolean
        default: true
      build_android:
        required: false
        type: boolean
        default: true
      build_ios:
        required: false
        type: boolean
        default: true
      ignore_eol:
        required: false
        type: boolean
        default: false
      keep_raw_artifacts:
        required: false
        type: boolean
        default: false

env:
  SCRIPTS_DIR: ${{ github.workspace }}/scripts
  COMMON_SCRIPTS_DIR: ${{ github.workspace }}/scripts/common
  CONFIG_DIR: ${{ github.workspace }}/config
  ASSETS_DIR: ${{ github.workspace }}/assets
  REDIST_DIR: ${{ github.workspace }}/redist
  INSTALLERS_DIR: ${{ github.workspace }}/installers
  COMMON_ASSETS_DIR: ${{ github.workspace }}/common-assets

jobs:
  # =========================================================================
  # 0. VALIDATE VERSION & EOL
  # =========================================================================
  validate-version:
    name: Validate Inputs
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      major_minor: ${{ steps.check.outputs.major_minor }}
      inno_app_id: ${{ steps.check.outputs.inno_app_id }}
      compile_matrix: ${{ steps.check.outputs.compile_matrix }}
      package_matrix: ${{ steps.check.outputs.package_matrix }}
      target_repo: ${{ steps.check.outputs.target_repo }}
      ref: ${{ steps.check.outputs.ref }}
      sha: ${{ steps.check.outputs.sha }}
      artifact_version: ${{ steps.check.outputs.artifact_version }}
      slugified_version: ${{ steps.check.outputs.slugified_version }}
      is_fork: ${{ steps.check.outputs.is_fork }}      
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Check EOL or Branch Existence
      - name: Check EOL or Branch Existence
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BUILD_WINDOWS: ${{ inputs.build_windows }}
          BUILD_LINUX: ${{ inputs.build_linux }}
          BUILD_MACOS: ${{ inputs.build_macos }}
          BUILD_ANDROID: ${{ inputs.build_android }}
          BUILD_IOS: ${{ inputs.build_ios }}
          SIGN_BINARIES: ${{ inputs.sign_binaries }}
          BUILD_INSTALLERS: ${{ inputs.build_installers }}
          KEEP_RAW_ARTIFACTS: ${{ inputs.keep_raw_artifacts }}
        run: bash ./scripts/00_validate_version/01_check_eol.sh "${{ inputs.version }}" "${{ inputs.build_type }}" "${{ inputs.ignore_eol }}"

      # Step 3: Upload Build Metadata (Universal)
      - name: Upload Build Metadata (Universal)
        if: steps.check.outputs.is_fork == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: build-metadata
          path: ${{ runner.temp }}/build-metadata/
          retention-days: 5

  # =========================================================================
  # 1. BUILD COMMON ASSETS (Headers & Docs)
  # =========================================================================
  build-common-assets:
    name: Build Headers & Docs
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Checkout OpenSSL Source Code
      - name: Checkout OpenSSL Source
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.validate-version.outputs.target_repo }}
          ref: ${{ needs.validate-version.outputs.sha }}
          path: openssl-src
      
      # Step 3: Build Common Assets
      - name: Build Common Assets
        run: bash ./scripts/01_build_common_assets/01_build_assets.sh "${{ github.workspace }}/openssl-src" "${{ github.workspace }}/common-assets"

      # Step 4: Generate Formatted LICENSE.rtf for WiX MSI
      - name: Generate Formatted LICENSE.rtf for WiX MSI
        shell: pwsh
        run: pwsh ./scripts/01_build_common_assets/02_generate_license_rtf.ps1

      # Step 5: Upload Common Assets
      - name: Upload Common Assets
        uses: actions/upload-artifact@v7
        with:
          name: openssl-common-assets-${{ github.run_id }}
          path: common-assets/usr/local
          retention-days: 1

  # =========================================================================
  # 2. COMPILE BINARIES (Fan-Out Matrix)
  # =========================================================================
  compile-binaries:
    name: Compile (${{ matrix.platform.label }} ${{ matrix.platform.arch }} ${{ matrix.linkage }})
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate-version.outputs.compile_matrix) }}
    runs-on: ${{ matrix.platform.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Checkout OpenSSL Source Code
      - name: Checkout OpenSSL Source
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.validate-version.outputs.target_repo }}
          ref: ${{ needs.validate-version.outputs.sha }}
          path: openssl-src

      # Step 3: Validate Azure Code Signing Secrets (Windows)
      - name: Validate Azure Code Signing Secrets
        if: matrix.platform.label == 'Windows' && inputs.sign_binaries == true
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: pwsh ./scripts/02_compile_binaries/01_validate_secrets.ps1

      # Step 4: Prepare Windows Targets
      - name: Prepare Windows Targets
        if: matrix.platform.label == 'Windows'
        shell: bash
        run: bash ./scripts/02_compile_binaries/02_prepare_win_targets.sh "${{ github.workspace }}/openssl-src"

      # Step 5: Install JOM (Parallel Build Tool)
      - name: Install JOM (Parallel Build Tool)
        if: matrix.platform.label == 'Windows'
        run: choco install jom --no-progress -y

      # Step 6: Compile and Stage Windows Binaries
      - name: Compile and Stage Windows Binaries
        if: matrix.platform.label == 'Windows'
        shell: cmd
        run: call scripts\02_compile_binaries\03_compile_windows.cmd ${{ matrix.platform.vcvars }} ${{ matrix.platform.target }} ${{ matrix.linkage }} "${{ github.workspace }}\openssl-src" "${{ github.workspace }}\temp_install" "${{ github.workspace }}\raw_artifact\dist" || exit /b %errorlevel%

      # Step 7: Check for Windows Binaries to Sign
      - name: Check for Windows Binaries to Sign
        if: matrix.platform.label == 'Windows' && inputs.sign_binaries == true
        id: check_binaries
        shell: pwsh
        run: pwsh ./scripts/02_compile_binaries/04_check_binaries.ps1 -Folder "${{ github.workspace }}\raw_artifact\dist"

      # Step 8: Azure Login
      - name: Azure Login
        if: matrix.platform.label == 'Windows' && inputs.sign_binaries == true && steps.check_binaries.outputs.has_binaries == 'true'
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Step 9: Sign Windows Binaries (Azure Artifact Signing)
      - name: Sign Windows Binaries (Azure Artifact Signing)
        if: matrix.platform.label == 'Windows' && inputs.sign_binaries == true && steps.check_binaries.outputs.has_binaries == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\raw_artifact\dist
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Step 10: Verify Signed Windows Binaries
      - name: Verify Signed Windows Binaries
        if: matrix.platform.label == 'Windows' && inputs.sign_binaries == true && steps.check_binaries.outputs.has_binaries == 'true'
        shell: pwsh
        run: pwsh ./scripts/02_compile_binaries/05_verify_signatures.ps1 -Folder "${{ github.workspace }}\raw_artifact\dist"

      # Step 11: Install Linux Dependencies
      - name: Install Linux Dependencies
        if: matrix.platform.label == 'Linux'
        run: bash ./scripts/02_compile_binaries/06_install_linux_deps.sh "${{ matrix.platform.arch }}"

      # Step 12: Compile Unix (POSIX)
      - name: Compile Unix (POSIX)
        if: matrix.platform.label != 'Windows'
        shell: bash
        run: bash ./scripts/02_compile_binaries/07_compile_posix.sh "${{ matrix.platform.label }}" "${{ matrix.platform.target }}" "${{ matrix.linkage }}" "${{ github.workspace }}/openssl-src" "${{ github.workspace }}/raw_artifact/usr/local" "${{ matrix.platform.minos || '' }}" "${{ matrix.platform.api || '' }}"

      # Step 13: Organize Unix Binaries
      - name: Organize Unix Binaries
        if: matrix.platform.label != 'Windows'
        shell: bash
        run: bash ./scripts/02_compile_binaries/08_organize_posix.sh "${{ matrix.platform.label }}" "${{ matrix.linkage }}" "${{ github.workspace }}/raw_artifact/usr/local" "${{ github.workspace }}/raw_artifact/dist"

      # Step 14: Upload Raw Artifact
      - name: Upload Raw Artifact
        uses: actions/upload-artifact@v7
        with:
          name: raw-${{ matrix.platform.label }}-${{ matrix.platform.arch }}-${{ matrix.linkage }}-${{ github.run_id }}
          path: raw_artifact/dist
          retention-days: 1
          
  # =========================================================================
  # 2b. COMPILE ARM64X SLICES IN PARALLEL (Native ARM64 + ARM64EC)
  # =========================================================================
  compile-windows-arm64x-slices:
    name: Compile Windows ARM64X Slice (${{ matrix.slice.label }} ${{ matrix.linkage }})
    needs: validate-version
    if: inputs.build_windows == true
    strategy:
      fail-fast: false
      matrix:
        linkage: [shared, static]
        slice:
          - { label: native-arm64, target: VC-WIN64-ARM, vcvars: amd64_arm64 }
          - { label: arm64ec,      target: VC-ARM64EC,   vcvars: amd64_arm64 }
    runs-on: windows-latest
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Checkout OpenSSL Source Code
      - name: Checkout OpenSSL Source
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.validate-version.outputs.target_repo }}
          ref: ${{ needs.validate-version.outputs.sha }}
          path: openssl-src

      # Step 3: Prepare HybridCRT Targets
      - name: Prepare HybridCRT Targets
        shell: bash
        run: bash ./scripts/03_compile_arm64x_slices/01_prepare_slice_targets.sh "${{ github.workspace }}/openssl-src"

      # Step 4: Install JOM (Parallel Build Tool)
      - name: Install JOM (Parallel Build Tool)
        run: choco install jom --no-progress -y

      # Step 5: Compile and Stage Slice Binaries
      - name: Compile and Stage Slice Binaries
        shell: cmd
        run: call scripts\03_compile_arm64x_slices\02_compile_slice.cmd ${{ matrix.slice.vcvars }} ${{ matrix.slice.target }} ${{ matrix.linkage }} "${{ github.workspace }}\openssl-src" "${{ github.workspace }}\temp_install" "${{ github.workspace }}\slice_out" || exit /b %errorlevel%

      # Step 6: Upload Slice Artifact
      - name: Upload Slice Artifact
        uses: actions/upload-artifact@v7
        with:
          name: slice-${{ matrix.slice.label }}-${{ matrix.linkage }}-${{ github.run_id }}
          path: slice_out/
          retention-days: 1

  # =========================================================================
  # 2c. MERGE, SIGN & VERIFY ARM64X BINARIES
  # =========================================================================
  merge-windows-arm64x:
    name: Merge & Link ARM64X Binaries
    needs: [validate-version, compile-windows-arm64x-slices]
    if: inputs.build_windows == true
    runs-on: windows-latest
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Download Slices
      - name: Download Slices
        uses: actions/download-artifact@v8
        with:
          pattern: slice-*
          path: slices
          merge-multiple: false

      - name: Fuse ARM64X Binaries and Dynamic Modules
        shell: pwsh
        run: pwsh ./scripts/04_merge_arm64x/01_fuse_binaries.ps1

      # Step 4: Recursive Deep Verification of All ARM64X Binaries
      - name: Recursive Deep Verification of All ARM64X Binaries
        shell: pwsh
        run: pwsh ./scripts/04_merge_arm64x/02_verify_arm64x.ps1 -DistDir "${{ github.workspace }}\raw_shared\dist"

      # Step 5: Check for Windows Binaries to Sign
      - name: Check for Windows Binaries to Sign
        if: inputs.sign_binaries == true
        id: check_binaries
        shell: pwsh
        run: pwsh ./scripts/04_merge_arm64x/03_check_binaries.ps1 -Folder "${{ github.workspace }}\raw_shared\dist"

      # Step 6: Azure Login
      - name: Azure Login
        if: inputs.sign_binaries == true && steps.check_binaries.outputs.has_binaries == 'true'
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Step 7: Sign Windows ARM64X Binaries
      - name: Sign Windows ARM64X Binaries
        if: inputs.sign_binaries == true && steps.check_binaries.outputs.has_binaries == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\raw_shared\dist
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Step 8: Verify Signed Windows ARM64X Binaries
      - name: Verify Signed Windows ARM64X Binaries
        if: steps.check_binaries.outputs.has_binaries == 'true'
        shell: pwsh
        run: pwsh ./scripts/04_merge_arm64x/04_verify_signatures.ps1 -Folder "${{ github.workspace }}\raw_shared\dist"

      # Step 9: Upload Raw ARM64 Shared Artifact
      - name: Upload Raw ARM64 Shared Artifact
        uses: actions/upload-artifact@v7
        with:
          name: raw-Windows-arm64-shared-${{ github.run_id }}
          path: raw_shared/dist
          retention-days: 1

      # Step 10: Upload Raw ARM64 Static Artifact
      - name: Upload Raw ARM64 Static Artifact
        uses: actions/upload-artifact@v7
        with:
          name: raw-Windows-arm64-static-${{ github.run_id }}
          path: raw_static/dist
          retention-days: 1

  # =========================================================================
  # 3a. BUILD WINDOWS MULTI-ARCH INSTALLER — Release Builds Only
  # =========================================================================
  InnoSetup-windows-installer:
    name: Inno Setup Windows Multi-Arch Installer
    needs: [validate-version, build-common-assets, compile-binaries, merge-windows-arm64x]
    # Execute ONLY if installers and Windows target are enabled:
    if: |
      inputs.build_installers == true &&
      inputs.build_windows == true &&
      needs.validate-version.outputs.is_fork == 'false'
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Validate Signing Secrets
      - name: Validate Signing Secrets
        if: inputs.sign_binaries == true
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: pwsh ./scripts/05_innosetup_installer/01_validate_secrets.ps1

      # Step 3: Download x64 Shared Artifact
      - name: Download x64 Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-x64-shared-${{ github.run_id }}
          path: raw-shared-x64

      # Step 4: Download x86 Shared Artifact
      - name: Download x86 Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-x86-shared-${{ github.run_id }}
          path: raw-shared-x86

      # Step 5: Download ARM64 Shared Artifact
      - name: Download ARM64 Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-arm64-shared-${{ github.run_id }}
          path: raw-shared-arm64

      # Step 6: Download Common Assets
      - name: Download Common Assets
        uses: actions/download-artifact@v8
        with:
          name: openssl-common-assets-${{ github.run_id }}
          path: common-assets

      # Step 7: Stage Multi-Arch Redistributables
      - name: Stage Multi-Arch Redistributables
        shell: pwsh
        run: pwsh ./scripts/05_innosetup_installer/02_stage_redist.ps1 -WorkspaceDir "${{ github.workspace }}"

      # Step 8: Install InnoSetup
      - name: Install InnoSetup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { Write-Error 'Failed to install InnoSetup'; exit 1 }

      # Step 9: Generate and Compile Multi-Arch Installer
      - name: Generate and Compile Multi-Arch Installer
        shell: pwsh
        run: |
          pwsh ./scripts/05_innosetup_installer/03_build_installer.ps1 `
            -Version "${{ needs.validate-version.outputs.version }}" `
            -MajorMinor "${{ needs.validate-version.outputs.major_minor }}" `
            -InnoAppId "${{ needs.validate-version.outputs.inno_app_id }}" `
            -PublisherName "${{ vars.PUBLISHER_DISPLAY_NAME || 'TaurusTLS Developers' }}" `
            -PublisherUrl "${{ vars.PUBLISHER_URL || 'https://github.com/TaurusTLS-Developers/OpenSSL-Distribution' }}"

      # Step 10: Azure Login
      - name: Azure Login
        if: inputs.sign_binaries == true
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Step 11: Sign Installer (Azure Artifact Signing)
      - name: Sign Installer (Azure Artifact Signing)
        if: inputs.sign_binaries == true
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\installers
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Step 12: Verify Signed Installer
      - name: Verify Signed Installer
        if: inputs.sign_binaries == true
        shell: pwsh
        run: pwsh ./scripts/05_innosetup_installer/04_verify_signatures.ps1 -Folder "${{ github.workspace }}\installers"

      # Step 13: Upload Multi-Arch Installer
      - name: Upload Multi-Arch Installer
        uses: actions/upload-artifact@v7
        with:
          name: openssl-${{ needs.validate-version.outputs.artifact_version }}-Windows-installer
          path: ${{ github.workspace }}\installers\openssl-${{ needs.validate-version.outputs.version }}-Windows-installer.exe
          archive: false
          retention-days: 5

  # =========================================================================
  # 3b. BUILD WINDOWS MSIX FRAMEWORK PACKAGES (Matrix) — Release Builds Only
  # =========================================================================
  msix-windows-installers:
    name: Windows MSIX Framework (${{ matrix.arch }})
    needs: [validate-version, build-common-assets, compile-binaries, merge-windows-arm64x]
    if: |
      inputs.build_installers == true &&
      inputs.build_windows == true &&
      needs.validate-version.outputs.is_fork == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   msix_arch: x64 }
          - { arch: x86,   msix_arch: x86 }
          - { arch: arm64, msix_arch: arm64 }
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Validate Signing Secrets
      - name: Validate Signing Secrets
        if: inputs.sign_binaries == true
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_MSIX_PUBLISHER: ${{ secrets.AZURE_MSIX_PUBLISHER }}
        run: pwsh ./scripts/06_msix_installers/01_validate_secrets.ps1

      # Step 3: Download Shared Artifact
      - name: Download Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-${{ matrix.arch }}-shared-${{ github.run_id }}
          path: raw-shared

      # Step 4: Download Common Assets
      - name: Download Common Assets
        uses: actions/download-artifact@v8
        with:
          name: openssl-common-assets-${{ github.run_id }}
          path: common-assets

      # Step 5: Build Framework MSIX Package
      - name: Build Framework MSIX Package
        shell: powershell
        run: |
          pwsh ./scripts/06_msix_installers/02_build_package.ps1 `
            -Version "${{ needs.validate-version.outputs.version }}" `
            -MajorMinor "${{ needs.validate-version.outputs.major_minor }}" `
            -Arch "${{ matrix.arch }}" `
            -MsixArch "${{ matrix.msix_arch }}" `
            -Publisher "${{ secrets.AZURE_MSIX_PUBLISHER }}" `
            -PublisherDisplayName "${{ vars.PUBLISHER_DISPLAY_NAME || 'TaurusTLS Developers' }}"

      # Step 6: Azure Login
      - name: Azure Login
        if: inputs.sign_binaries == true
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Step 7: Sign MSIX Package (Azure Artifact Signing)
      - name: Sign MSIX Package (Azure Artifact Signing)
        if: inputs.sign_binaries == true
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\installers
          files-folder-filter: msix
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Step 8: Verify Signed MSIX Package
      - name: Verify Signed MSIX Package
        if: inputs.sign_binaries == true
        shell: pwsh
        run: pwsh ./scripts/06_msix_installers/03_verify_signatures.ps1 -Folder "${{ github.workspace }}\installers"

      # Step 9: Upload MSIX Framework Artifact
      - name: Upload MSIX Framework Artifact
        uses: actions/upload-artifact@v7
        with:
          name: openssl-${{ needs.validate-version.outputs.artifact_version }}-Windows-${{ matrix.arch }}-msix
          path: ${{ github.workspace }}\installers\openssl-${{ needs.validate-version.outputs.version }}-Windows-${{ matrix.arch }}.msix
          archive: false
          retention-days: 5
  
  # =========================================================================
  # 3c. BUILD WINDOWS WIX MSI INSTALLERS (Matrix) — Release Builds Only
  # =========================================================================
  wix-windows-installers:
    name: Windows MSI (${{ matrix.arch }})
    needs: [validate-version, build-common-assets, compile-binaries, merge-windows-arm64x]
    if: |
      inputs.build_installers == true &&
      inputs.build_windows == true &&
      needs.validate-version.outputs.is_fork == 'false'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   wix_arch: x64,   upgrade_code: "55bf14ca-1e2e-4a0f-8836-e5dbe6275942", pf_folder: "ProgramFiles64Folder" }
          - { arch: x86,   wix_arch: x86,   upgrade_code: "78bdf7e2-ea72-4928-818a-5314814ce8e6", pf_folder: "ProgramFilesFolder" }
          - { arch: arm64, wix_arch: arm64, upgrade_code: "1dc9c175-290b-4848-b7de-f5b1bc45a103", pf_folder: "ProgramFiles64Folder" }
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Validate Signing Secrets
      - name: Validate Signing Secrets
        if: inputs.sign_binaries == true
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: pwsh ./scripts/07_wix_installers/01_validate_secrets.ps1

      # Step 3: Download x64 Shared Artifact
      - name: Download x64 Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-x64-shared-${{ github.run_id }}
          path: raw-shared-x64

      # Step 4: Download x86 Shared Artifact
      - name: Download x86 Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-x86-shared-${{ github.run_id }}
          path: raw-shared-x86

      # Step 5: Download ARM64 Shared Artifact
      - name: Download ARM64 Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-arm64-shared-${{ github.run_id }}
          path: raw-shared-arm64

      # Step 6: Download Common Assets
      - name: Download Common Assets
        uses: actions/download-artifact@v8
        with:
          name: openssl-common-assets-${{ github.run_id }}
          path: common-assets

      # Step 7: Stage Redistributables & Convert LICENSE to RTF
      - name: Stage Redistributables & Convert LICENSE to RTF
        shell: pwsh
        run: pwsh ./scripts/07_wix_installers/02_stage_redist.ps1 -WorkspaceDir "${{ github.workspace }}"

      # Step 8: Build MSI with WiX
      - name: Build MSI with WiX
        shell: pwsh
        run: |
          pwsh ./scripts/07_wix_installers/03_build_msi.ps1 `
            -Version "${{ needs.validate-version.outputs.version }}" `
            -MajorMinor "${{ needs.validate-version.outputs.major_minor }}" `
            -Arch "${{ matrix.arch }}" `
            -WixArch "${{ matrix.wix_arch }}" `
            -PfFolder "${{ matrix.pf_folder }}" `
            -PublisherName "${{ vars.PUBLISHER_DISPLAY_NAME || 'TaurusTLS Developers' }}" `
            -PublisherUrl "${{ vars.PUBLISHER_URL || 'https://github.com/TaurusTLS-Developers/OpenSSL-Distribution' }}"

      # Step 9: Azure Login
      - name: Azure Login
        if: inputs.sign_binaries == true
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Step 10: Sign MSI (Azure Artifact Signing)
      - name: Sign MSI (Azure Artifact Signing)
        if: inputs.sign_binaries == true
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\installers
          files-folder-filter: msi
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Step 11: Verify Signed MSI
      - name: Verify Signed MSI
        if: inputs.sign_binaries == true
        shell: pwsh
        run: pwsh ./scripts/07_wix_installers/04_verify_signatures.ps1 -Folder "${{ github.workspace }}\installers"

      # Step 12: Upload MSI Artifact
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: openssl-${{ needs.validate-version.outputs.artifact_version }}-Windows-${{ matrix.arch }}-msi
          path: ${{ github.workspace }}\installers\openssl-${{ needs.validate-version.outputs.version }}-Windows-${{ matrix.arch }}.msi
          archive: false
          retention-days: 5

  # =========================================================================
  # 4. PACKAGE RELEASE (Fan-In Matrix)
  # =========================================================================
  package-release:
    name: Package (${{ matrix.label }} ${{ matrix.arch }})
    needs: [validate-version, build-common-assets, compile-binaries, merge-windows-arm64x]
    if: always() && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.validate-version.outputs.package_matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6
      
      # Step 2: Download Common Assets
      - name: Download Common Assets
        uses: actions/download-artifact@v8
        with:
          name: openssl-common-assets-${{ github.run_id }}
          path: common-assets
          
      # Step 3: Download Raw Binaries (Standard)
      - name: Download Raw Binaries (Standard)
        if: matrix.label != 'macOS'
        uses: actions/download-artifact@v8
        with:
          pattern: raw-${{ matrix.label }}-${{ matrix.arch }}-*-${{ github.run_id }}
          path: raw-binaries
          merge-multiple: false
          
      # Step 4: Download Raw Binaries (macOS Universal)
      - name: Download Raw Binaries (macOS Universal)
        if: matrix.label == 'macOS'
        uses: actions/download-artifact@v8
        with:
          pattern: raw-macOS-*-${{ github.run_id }}
          path: raw-binaries
          merge-multiple: false

      # Step 5: Merge Binaries and Assets
      - name: Merge Binaries and Assets
        if: |
          matrix.label != 'macOS' && 
          (
            (matrix.label == 'Windows' && inputs.build_windows == true) || 
            (matrix.label == 'Linux' && inputs.build_linux == true) || 
            (matrix.label == 'Android' && inputs.build_android == true) || 
            (matrix.label == 'iOS' && inputs.build_ios == true)
          )
        shell: bash
        run: bash ./scripts/08_package_release/01_merge_binaries.sh "${{ github.workspace }}/raw-binaries" "${{ github.workspace }}/dist"

      # Step 6: Organize & Lipo (macOS Universal)
      - name: Build macOS Universal Binaries
        if: matrix.label == 'macOS' && inputs.build_macos == true
        shell: bash
        run: bash ./scripts/08_package_release/02_build_macos_universal.sh "${{ github.workspace }}/raw-binaries" "${{ github.workspace }}/dist"

      # Step 7: Finalize Package
      - name: Finalize Package
        if: |
          (matrix.label == 'Windows' && inputs.build_windows == true) ||
          (matrix.label == 'Linux' && inputs.build_linux == true) ||
          (matrix.label == 'macOS' && inputs.build_macos == true) ||
          (matrix.label == 'Android' && inputs.build_android == true) ||
          (matrix.label == 'iOS' && inputs.build_ios == true)
        shell: bash
        run: bash ./scripts/08_package_release/03_finalize_package.sh "${{ matrix.label }}" "${{ matrix.arch }}" "${{ inputs.build_type || 'release' }}" "${{ needs.validate-version.outputs.artifact_version }}" "${{ needs.validate-version.outputs.slugified_version }}" "${{ github.workspace }}/common-assets" "${{ github.workspace }}/dist" "${{ github.workspace }}"

      # Step 8: Upload Final Archive
      - name: Upload Final Archive
        if: |
          (matrix.label == 'Windows' && inputs.build_windows == true) ||
          (matrix.label == 'Linux' && inputs.build_linux == true) ||
          (matrix.label == 'macOS' && inputs.build_macos == true) ||
          (matrix.label == 'Android' && inputs.build_android == true) ||
          (matrix.label == 'iOS' && inputs.build_ios == true)
        uses: actions/upload-artifact@v7
        with:
          name: openssl-${{ needs.validate-version.outputs.artifact_version }}-${{ matrix.label }}-${{ matrix.arch }}
          path: ${{ env.ARCHIVE_FILE }}
          archive: false
          retention-days: 5

  # =========================================================================
  # 5. CLEANUP RAW & INTERMEDIATE ARTIFACTS
  # =========================================================================
  cleanup-artifacts:
    name: Cleanup Intermediate Artifacts
    needs: [package-release, InnoSetup-windows-installer, msix-windows-installers, wix-windows-installers]
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.keep_raw_artifacts != true &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      actions: write
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Delete Intermediate Artifacts (raw, slice, common-assets)
      - name: Delete Raw and Common Artifacts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/09_cleanup_artifacts/01_delete_artifacts.sh "${{ github.run_id }}" "${{ github.repository }}"
