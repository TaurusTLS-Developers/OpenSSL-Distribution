name: Build OpenSSL
run-name: Build OpenSSL ${{ inputs.version }} via ${{ github.event_name }}

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Source: OpenSSL Release or OpenSSL Branch/OpenSSL fork'
        required: true
        type: choice
        options:
          - release
          - branch
        default: release
      version:
        description: 'OpenSSL Release Version, OpenSSL Branch Name or OpenSSL Fork Repo(e.g. 3.4.0, master, or user/repo/branch)'
        required: true
        type: string
      ignore_eol:
        description: 'Ignore EOL Check'
        required: false
        type: boolean
        default: false
      keep_raw_artifacts:
        description: 'Keep raw build artifacts'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      build_type:
        required: false
        type: string
        default: release
      version:
        required: true
        type: string
      ignore_eol:
        required: false
        type: boolean
        default: false
      keep_raw_artifacts:
        required: false
        type: boolean
        default: false

jobs:
  # =========================================================================
  # 0. VALIDATE VERSION & EOL
  # =========================================================================
  validate-version:
    name: Validate Inputs
    runs-on: ubuntu-latest
    permissions:
      actions: write
    outputs:
      version: ${{ steps.check.outputs.version }}
      major_minor: ${{ steps.check.outputs.major_minor }}
      inno_app_id: ${{ steps.check.outputs.inno_app_id }}
      target_repo: ${{ steps.check.outputs.target_repo }}
      ref: ${{ steps.check.outputs.ref }}
      sha: ${{ steps.check.outputs.sha }}
      artifact_version: ${{ steps.check.outputs.artifact_version }}
      slugified_version: ${{ steps.check.outputs.slugified_version }}
      is_fork: ${{ steps.check.outputs.is_fork }}
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Check EOL or Branch Existence
      - name: Check EOL or Branch Existence
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          BUILD_TYPE: ${{ inputs.build_type }}
          IGNORE_EOL: ${{ inputs.ignore_eol }}
        run: bash ./scripts/0_validate-version_2_check_eol.sh

  # =========================================================================
  # 1. BUILD COMMON ASSETS (Headers & Docs)
  # =========================================================================
  build-common-assets:
    name: Build Headers & Docs
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Checkout OpenSSL Source Code
      - name: Checkout OpenSSL Source
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.validate-version.outputs.target_repo }}
          ref: ${{ needs.validate-version.outputs.sha }}
          path: openssl-src
      
      # Step 3: Build Common Assets
      - name: Build Common Assets
        run: bash ./scripts/1_build-common-assets_3_build.sh "$GITHUB_WORKSPACE/openssl-src" "$GITHUB_WORKSPACE/common-assets" "$GITHUB_WORKSPACE/config"

      # Step 4: Generate Formatted LICENSE.rtf for WiX MSI
      - name: Generate Formatted LICENSE.rtf for WiX MSI
        shell: pwsh
        run: pwsh ./scripts/1_build-common-assets_4_generate_license_rtf.ps1 -InputPath common-assets/usr/local/LICENSE.txt -OutputPath common-assets/usr/local/LICENSE.rtf

      # Step 5: Upload Common Assets
      - name: Upload Common Assets
        uses: actions/upload-artifact@v7
        with:
          name: openssl-common-assets-${{ github.run_id }}
          path: common-assets/usr/local
          retention-days: 1

  # =========================================================================
  # 2. COMPILE BINARIES (Fan-Out Matrix)
  # =========================================================================
  compile-binaries:
    name: Compile (${{ matrix.platform.label }} ${{ matrix.platform.arch }} ${{ matrix.linkage }})
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        linkage: [shared, static]
        platform:
          - { label: Windows, os: windows-latest, arch: x64, target: VC-WIN64A, vcvars: amd64 }
          - { label: Windows, os: windows-latest, arch: x86, target: VC-WIN32, vcvars: x86 }
          - { label: Linux, os: ubuntu-latest, arch: x64, target: linux-x86_64 }
          - { label: Linux, os: ubuntu-latest, arch: arm64, target: linux-aarch64 }
          - { label: macOS, os: macos-14, arch: x64, target: darwin64-x86_64-cc, minos: "10.14" }
          - { label: macOS, os: macos-14, arch: arm64, target: darwin64-arm64-cc, minos: "11.0" }
          - { label: Android, os: ubuntu-latest, arch: arm64, target: android-arm64, api: 21 }
          - { label: Android, os: ubuntu-latest, arch: arm, target: android-arm, api: 21 }
          - { label: iOS, os: macos-14, arch: arm64, target: ios64-cross }
          - { label: iOS, os: macos-14, arch: sim-arm64, target: iossimulator-xcrun, minos: "11.0" }
        exclude:
          - linkage: shared
            platform: { label: iOS }
          
    runs-on: ${{ matrix.platform.os }}
    permissions:
      id-token: write
      contents: read
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Checkout OpenSSL Source Code
      - name: Checkout OpenSSL Source
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.validate-version.outputs.target_repo }}
          ref: ${{ needs.validate-version.outputs.sha }}
          path: openssl-src

      # Step 3: Validate Azure Code Signing Secrets (Windows)
      - name: Validate Azure Code Signing Secrets
        if: matrix.platform.label == 'Windows'
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: pwsh ./scripts/2_compile-binaries_3_validate_secrets.ps1

      # Step 4: Prepare Windows Targets
      - name: Prepare Windows Targets
        if: matrix.platform.label == 'Windows'
        shell: bash
        run: bash ./scripts/2_compile-binaries_4_prepare_windows_targets.sh "$GITHUB_WORKSPACE/openssl-src" "$GITHUB_WORKSPACE/config"

      # Step 5: Compile and Stage Windows Binaries
      - name: Compile and Stage Windows Binaries
        if: matrix.platform.label == 'Windows'
        shell: cmd
        run: call scripts\2_compile-binaries_5_compile_windows.cmd ${{ matrix.platform.vcvars }} ${{ matrix.platform.target }} ${{ matrix.linkage }} "%GITHUB_WORKSPACE%\openssl-src" "%GITHUB_WORKSPACE%\temp_install" "%GITHUB_WORKSPACE%\raw_artifact\dist"

      # Step 6: Check for Windows Binaries to Sign
      - name: Check for Windows Binaries to Sign
        if: matrix.platform.label == 'Windows'
        id: check_binaries
        shell: pwsh
        run: pwsh ./scripts/2_compile-binaries_6_check_binaries.ps1 -Folder "${{ github.workspace }}\raw_artifact\dist"

      # Step 7: Azure Login
      - name: Azure Login
        if: matrix.platform.label == 'Windows' && steps.check_binaries.outputs.has_binaries == 'true'
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Step 8: Sign Windows Binaries (Azure Artifact Signing)
      - name: Sign Windows Binaries (Azure Artifact Signing)
        if: matrix.platform.label == 'Windows' && steps.check_binaries.outputs.has_binaries == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\raw_artifact\dist
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Step 9: Verify Signed Windows Binaries
      - name: Verify Signed Windows Binaries
        if: matrix.platform.label == 'Windows' && steps.check_binaries.outputs.has_binaries == 'true'
        shell: pwsh
        run: pwsh ./scripts/2_compile-binaries_9_verify_signatures.ps1 -Folder "${{ github.workspace }}\raw_artifact\dist"

      # Step 10: Install Linux Dependencies
      - name: Install Linux Dependencies
        if: matrix.platform.label == 'Linux'
        run: bash ./scripts/2_compile-binaries_10_install_linux_deps.sh ${{ matrix.platform.arch }}

      # Step 11: Compile Unix (POSIX)
      - name: Compile Unix (POSIX)
        if: matrix.platform.label != 'Windows'
        shell: bash
        run: bash ./scripts/2_compile-binaries_11_compile_posix.sh "${{ matrix.platform.label }}" "${{ matrix.platform.arch }}" "${{ matrix.platform.target }}" "${{ matrix.linkage }}" "${{ matrix.platform.minos || '' }}" "${{ github.workspace }}/raw_artifact/usr/local" "${{ github.workspace }}/openssl-src"

      # Step 12: Organize Unix Binaries
      - name: Organize Unix Binaries
        if: matrix.platform.label != 'Windows'
        shell: bash
        run: bash ./scripts/2_compile-binaries_12_organize_posix.sh "${{ matrix.platform.label }}" "${{ matrix.linkage }}" "${{ github.workspace }}/raw_artifact/usr/local" "${{ github.workspace }}/raw_artifact/dist"

      # Step 13: Upload Raw Artifact
      - name: Upload Raw Artifact
        uses: actions/upload-artifact@v7
        with:
          name: raw-${{ matrix.platform.label }}-${{ matrix.platform.arch }}-${{ matrix.linkage }}-${{ github.run_id }}
          path: raw_artifact/dist
          retention-days: 1
          
  # =========================================================================
  # 2b. COMPILE ARM64X SLICES IN PARALLEL (Native ARM64 + ARM64EC)
  # =========================================================================
  compile-windows-arm64x-slices:
    name: Compile Windows ARM64X Slice (${{ matrix.slice.label }} ${{ matrix.linkage }})
    needs: validate-version
    strategy:
      fail-fast: false
      matrix:
        linkage: [shared, static]
        slice:
          - { label: native-arm64, target: VC-WIN64-ARM, vcvars: amd64_arm64 }
          - { label: arm64ec,      target: VC-ARM64EC,   vcvars: amd64_arm64 }
    runs-on: windows-latest
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Checkout OpenSSL Source Code
      - name: Checkout OpenSSL Source
        uses: actions/checkout@v6
        with:
          repository: ${{ needs.validate-version.outputs.target_repo }}
          ref: ${{ needs.validate-version.outputs.sha }}
          path: openssl-src

      # Step 3: Prepare HybridCRT Targets
      - name: Prepare HybridCRT Targets
        shell: bash
        run: bash ./scripts/2b_compile-windows-arm64x-slices_3_prepare_targets.sh "$GITHUB_WORKSPACE/openssl-src" "$GITHUB_WORKSPACE/config"

      # Step 4: Compile and Stage Slice Binaries
      - name: Compile and Stage Slice Binaries
        shell: cmd
        run: call scripts\2b_compile-windows-arm64x-slices_4_compile_slice.cmd ${{ matrix.slice.vcvars }} ${{ matrix.slice.target }} ${{ matrix.linkage }} "%GITHUB_WORKSPACE%\openssl-src" "%GITHUB_WORKSPACE%\temp_install" "%GITHUB_WORKSPACE%\slice_out"

      # Step 5: Upload Slice Artifact
      - name: Upload Slice Artifact
        uses: actions/upload-artifact@v7
        with:
          name: slice-${{ matrix.slice.label }}-${{ matrix.linkage }}-${{ github.run_id }}
          path: slice_out/
          retention-days: 1

  # =========================================================================
  # 2c. MERGE, SIGN & VERIFY ARM64X BINARIES
  # =========================================================================
  merge-windows-arm64x:
    name: Merge & Link ARM64X Binaries
    needs: [validate-version, compile-windows-arm64x-slices]
    runs-on: windows-latest
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Download Slices
      - name: Download Slices
        uses: actions/download-artifact@v8
        with:
          pattern: slice-*
          path: slices
          merge-multiple: false

      # Step 3: Fuse ARM64X Binaries and Dynamic Modules
      - name: Fuse ARM64X Binaries and Dynamic Modules
        shell: pwsh
        run: pwsh ./scripts/2c_merge-windows-arm64x_3_fuse.ps1 -SlicesDir "$env:GITHUB_WORKSPACE\slices" -DistSharedDir "$env:GITHUB_WORKSPACE\raw_shared\dist" -DistStaticDir "$env:GITHUB_WORKSPACE\raw_static\dist" -WorkspaceDir "$env:GITHUB_WORKSPACE"

      # Step 4: Recursive Deep Verification of All ARM64X Binaries
      - name: Recursive Deep Verification of All ARM64X Binaries
        shell: pwsh
        run: pwsh ./scripts/2c_merge-windows-arm64x_4_verify_arm64x.ps1 -DistDir "$env:GITHUB_WORKSPACE\raw_shared\dist"

      # Step 5: Check for Windows Binaries to Sign
      - name: Check for Windows Binaries to Sign
        id: check_binaries
        shell: pwsh
        run: pwsh ./scripts/2c_merge-windows-arm64x_5_check_binaries.ps1 -Folder "$env:GITHUB_WORKSPACE\raw_shared\dist"

      # Step 6: Azure Login
      - name: Azure Login
        if: steps.check_binaries.outputs.has_binaries == 'true'
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Step 7: Sign Windows ARM64X Binaries
      - name: Sign Windows ARM64X Binaries
        if: steps.check_binaries.outputs.has_binaries == 'true'
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\raw_shared\dist
          files-folder-filter: exe,dll
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Step 8: Verify Signed Windows ARM64X Binaries
      - name: Verify Signed Windows ARM64X Binaries
        if: steps.check_binaries.outputs.has_binaries == 'true'
        shell: pwsh
        run: pwsh ./scripts/2c_merge-windows-arm64x_8_verify_signatures.ps1 -Folder "$env:GITHUB_WORKSPACE\raw_shared\dist"

      # Step 9: Upload Raw ARM64 Shared Artifact
      - name: Upload Raw ARM64 Shared Artifact
        uses: actions/upload-artifact@v7
        with:
          name: raw-Windows-arm64-shared-${{ github.run_id }}
          path: raw_shared/dist
          retention-days: 1

      # Step 10: Upload Raw ARM64 Static Artifact
      - name: Upload Raw ARM64 Static Artifact
        uses: actions/upload-artifact@v7
        with:
          name: raw-Windows-arm64-static-${{ github.run_id }}
          path: raw_static/dist
          retention-days: 1

  # =========================================================================
  # 3a. BUILD WINDOWS MULTI-ARCH INSTALLER — Release Builds Only
  # =========================================================================
  InnoSetup-windows-installer:
    name: Inno Setup Windows Multi-Arch Installer
    needs: [validate-version, build-common-assets, compile-binaries, merge-windows-arm64x]
    if: needs.validate-version.outputs.is_fork == 'false' && inputs.build_type == 'release'
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Validate Signing Secrets
      - name: Validate Signing Secrets
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: pwsh ./scripts/3a_innosetup-windows-installer_2_validate_secrets.ps1

      # Step 3: Download x64 Shared Artifact
      - name: Download x64 Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-x64-shared-${{ github.run_id }}
          path: raw-shared-x64

      # Step 4: Download x86 Shared Artifact
      - name: Download x86 Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-x86-shared-${{ github.run_id }}
          path: raw-shared-x86

      # Step 5: Download ARM64 Shared Artifact
      - name: Download ARM64 Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-arm64-shared-${{ github.run_id }}
          path: raw-shared-arm64

      # Step 6: Download Common Assets
      - name: Download Common Assets
        uses: actions/download-artifact@v8
        with:
          name: openssl-common-assets-${{ github.run_id }}
          path: common-assets

      # Step 7: Stage Multi-Arch Redistributables
      - name: Stage Multi-Arch Redistributables
        shell: pwsh
        run: pwsh ./scripts/3a_innosetup-windows-installer_7_stage_redist.ps1 -WorkspaceDir "$env:GITHUB_WORKSPACE"

      # Step 8: Install InnoSetup
      - name: Install InnoSetup
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          if ($LASTEXITCODE -ne 0) { Write-Error 'Failed to install InnoSetup'; exit 1 }

      # Step 9: Generate and Compile Multi-Arch Installer
      - name: Generate and Compile Multi-Arch Installer
        shell: pwsh
        run: |
          pwsh ./scripts/3a_innosetup-windows-installer_9_build_installer.ps1 `
            -Version "${{ needs.validate-version.outputs.version }}" `
            -MajorMinor "${{ needs.validate-version.outputs.major_minor }}" `
            -InnoAppId "${{ needs.validate-version.outputs.inno_app_id }}" `
            -PublisherName "${{ vars.PUBLISHER_DISPLAY_NAME || 'TaurusTLS Developers' }}" `
            -PublisherUrl "${{ vars.PUBLISHER_URL || 'https://github.com/TaurusTLS-Developers/OpenSSL-Distribution' }}"

      # Step 10: Azure Login
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Step 11: Sign Installer (Azure Artifact Signing)
      - name: Sign Installer (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\installers
          files-folder-filter: exe
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Step 12: Verify Signed Installer
      - name: Verify Signed Installer
        shell: pwsh
        run: pwsh ./scripts/3a_innosetup-windows-installer_12_verify_signatures.ps1 -Folder "${{ github.workspace }}\installers"

      # Step 13: Upload Multi-Arch Installer
      - name: Upload Multi-Arch Installer
        uses: actions/upload-artifact@v7
        with:
          name: openssl-${{ needs.validate-version.outputs.artifact_version }}-Windows-installer
          path: ${{ github.workspace }}\installers\openssl-${{ needs.validate-version.outputs.version }}-Windows-installer.exe
          archive: false
          retention-days: 5

  # =========================================================================
  # 3b. BUILD WINDOWS MSIX FRAMEWORK PACKAGES (Matrix) — Release Builds Only
  # =========================================================================
  msix-windows-installers:
    name: Windows MSIX Framework (${{ matrix.arch }})
    needs: [validate-version, build-common-assets, compile-binaries, merge-windows-arm64x]
    if: needs.validate-version.outputs.is_fork == 'false' && inputs.build_type == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   msix_arch: x64 }
          - { arch: x86,   msix_arch: x86 }
          - { arch: arm64, msix_arch: arm64 }
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Validate Signing Secrets
      - name: Validate Signing Secrets
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          AZURE_MSIX_PUBLISHER: ${{ secrets.AZURE_MSIX_PUBLISHER }}
        run: pwsh ./scripts/3b_msix-windows-installers_2_validate_secrets.ps1

      # Step 3: Download Shared Artifact
      - name: Download Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-${{ matrix.arch }}-shared-${{ github.run_id }}
          path: raw-shared

      # Step 4: Download Common Assets
      - name: Download Common Assets
        uses: actions/download-artifact@v8
        with:
          name: openssl-common-assets-${{ github.run_id }}
          path: common-assets

      # Step 5: Build Framework MSIX Package
      - name: Build Framework MSIX Package
        shell: powershell
        run: |
          pwsh ./scripts/3b_msix-windows-installers_5_build_package.ps1 `
            -Version "${{ needs.validate-version.outputs.version }}" `
            -MajorMinor "${{ needs.validate-version.outputs.major_minor }}" `
            -Arch "${{ matrix.arch }}" `
            -MsixArch "${{ matrix.msix_arch }}" `
            -Publisher "${{ secrets.AZURE_MSIX_PUBLISHER }}" `
            -PublisherDisplayName "${{ vars.PUBLISHER_DISPLAY_NAME || 'TaurusTLS Developers' }}"

      # Step 6: Azure Login
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Step 7: Sign MSIX Package (Azure Artifact Signing)
      - name: Sign MSIX Package (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\installers
          files-folder-filter: msix
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Step 8: Verify Signed MSIX Package
      - name: Verify Signed MSIX Package
        shell: pwsh
        run: pwsh ./scripts/3b_msix-windows-installers_8_verify_signatures.ps1 -Folder "${{ github.workspace }}\installers"

      # Step 9: Upload MSIX Framework Artifact
      - name: Upload MSIX Framework Artifact
        uses: actions/upload-artifact@v7
        with:
          name: openssl-${{ needs.validate-version.outputs.artifact_version }}-Windows-${{ matrix.arch }}-msix
          path: ${{ github.workspace }}\installers\openssl-${{ needs.validate-version.outputs.version }}-Windows-${{ matrix.arch }}.msix
          archive: false
          retention-days: 5
  
  # =========================================================================
  # 3c. BUILD WINDOWS WIX MSI INSTALLERS (Matrix) — Release Builds Only
  # =========================================================================
  wix-windows-installers:
    name: Windows MSI (${{ matrix.arch }})
    needs: [validate-version, build-common-assets, compile-binaries, merge-windows-arm64x]
    if: needs.validate-version.outputs.is_fork == 'false' && inputs.build_type == 'release'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   wix_arch: x64,   upgrade_code: "55bf14ca-1e2e-4a0f-8836-e5dbe6275942", pf_folder: "ProgramFiles64Folder" }
          - { arch: x86,   wix_arch: x86,   upgrade_code: "78bdf7e2-ea72-4928-818a-5314814ce8e6", pf_folder: "ProgramFilesFolder" }
          - { arch: arm64, wix_arch: arm64, upgrade_code: "1dc9c175-290b-4848-b7de-f5b1bc45a103", pf_folder: "ProgramFiles64Folder" }
    runs-on: windows-latest
    permissions:
      id-token: write
      contents: read
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Validate Signing Secrets
      - name: Validate Signing Secrets
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          AZURE_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
        run: pwsh ./scripts/3c_wix-windows-installers_2_validate_secrets.ps1

      # Step 3: Download x64 Shared Artifact
      - name: Download x64 Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-x64-shared-${{ github.run_id }}
          path: raw-shared-x64

      # Step 4: Download x86 Shared Artifact
      - name: Download x86 Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-x86-shared-${{ github.run_id }}
          path: raw-shared-x86

      # Step 5: Download ARM64 Shared Artifact
      - name: Download ARM64 Shared Artifact
        uses: actions/download-artifact@v8
        with:
          name: raw-Windows-arm64-shared-${{ github.run_id }}
          path: raw-shared-arm64

      # Step 6: Download Common Assets
      - name: Download Common Assets
        uses: actions/download-artifact@v8
        with:
          name: openssl-common-assets-${{ github.run_id }}
          path: common-assets

      # Step 7: Stage Redistributables & Convert LICENSE to RTF
      - name: Stage Redistributables & Convert LICENSE to RTF
        shell: pwsh
        run: pwsh ./scripts/3c_wix-windows-installers_7_stage_redist.ps1 -WorkspaceDir "$env:GITHUB_WORKSPACE"

      # Step 8: Build MSI with WiX
      - name: Build MSI with WiX
        shell: pwsh
        run: |
          pwsh ./scripts/3c_wix-windows-installers_8_build_msi.ps1 `
            -Version "${{ needs.validate-version.outputs.version }}" `
            -MajorMinor "${{ needs.validate-version.outputs.major_minor }}" `
            -Arch "${{ matrix.arch }}" `
            -WixArch "${{ matrix.wix_arch }}" `
            -PfFolder "${{ matrix.pf_folder }}" `
            -PublisherName "${{ vars.PUBLISHER_DISPLAY_NAME || 'TaurusTLS Developers' }}" `
            -PublisherUrl "${{ vars.PUBLISHER_URL || 'https://github.com/TaurusTLS-Developers/OpenSSL-Distribution' }}"

      # Step 9: Azure Login
      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      # Step 10: Sign MSI (Azure Artifact Signing)
      - name: Sign MSI (Azure Artifact Signing)
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ secrets.AZURE_CODESIGNING_ENDPOINT || 'https://eus.codesigning.azure.net/' }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\installers
          files-folder-filter: msi
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # Step 11: Verify Signed MSI
      - name: Verify Signed MSI
        shell: pwsh
        run: pwsh ./scripts/3c_wix-windows-installers_11_verify_signatures.ps1 -Folder "${{ github.workspace }}\installers"

      # Step 12: Upload MSI Artifact
      - name: Upload MSI Artifact
        uses: actions/upload-artifact@v7
        with:
          name: openssl-${{ needs.validate-version.outputs.artifact_version }}-Windows-${{ matrix.arch }}-msi
          path: ${{ github.workspace }}\installers\openssl-${{ needs.validate-version.outputs.version }}-Windows-${{ matrix.arch }}.msi
          archive: false
          retention-days: 5

  # =========================================================================
  # 4. PACKAGE RELEASE (Fan-In Matrix)
  # =========================================================================
  package-release:
    name: Package (${{ matrix.label }} ${{ matrix.arch }})
    needs: [validate-version, build-common-assets, compile-binaries, merge-windows-arm64x]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: Windows, arch: x64, runner: ubuntu-latest }
          - { label: Windows, arch: x86, runner: ubuntu-latest }
          - { label: Windows, arch: arm64, runner: ubuntu-latest }
          - { label: Linux, arch: x64, runner: ubuntu-latest }
          - { label: Linux, arch: arm64, runner: ubuntu-latest }
          - { label: Android, arch: arm64, runner: ubuntu-latest }
          - { label: Android, arch: arm, runner: ubuntu-latest }
          - { label: macOS, arch: universal, runner: macos-14 }
          - { label: iOS, arch: arm64, runner: macos-14 }
          - { label: iOS, arch: sim-arm64, runner: macos-14 }
          
    runs-on: ${{ matrix.runner }}
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6
      
      # Step 2: Download Common Assets
      - name: Download Common Assets
        uses: actions/download-artifact@v8
        with:
          name: openssl-common-assets-${{ github.run_id }}
          path: common-assets
          
      # Step 3: Download Raw Binaries (Standard)
      - name: Download Raw Binaries (Standard)
        if: matrix.label != 'macOS'
        uses: actions/download-artifact@v8
        with:
          pattern: raw-${{ matrix.label }}-${{ matrix.arch }}-*-${{ github.run_id }}
          path: raw-binaries
          merge-multiple: false
          
      # Step 4: Download Raw Binaries (macOS Universal)
      - name: Download Raw Binaries (macOS Universal)
        if: matrix.label == 'macOS'
        uses: actions/download-artifact@v8
        with:
          pattern: raw-macOS-*-${{ github.run_id }}
          path: raw-binaries
          merge-multiple: false

      # Step 5: Merge Binaries and Assets
      - name: Merge Binaries and Assets
        if: matrix.label != 'macOS'
        shell: bash
        run: bash ./scripts/4_package-release_5_merge_binaries.sh "$GITHUB_WORKSPACE/raw-binaries" "$GITHUB_WORKSPACE/dist"

      # Step 6: Organize & Lipo (macOS Universal)
      - name: Organize & Lipo (macOS Universal)
        if: matrix.label == 'macOS'
        shell: bash
        run: bash ./scripts/4_package-release_6_build_macos_universal.sh "$GITHUB_WORKSPACE/raw-binaries" "$GITHUB_WORKSPACE/dist"

      # Step 7: Finalize Package
      - name: Finalize Package
        shell: bash
        run: bash ./scripts/4_package-release_7_finalize_package.sh "${{ matrix.label }}" "${{ matrix.arch }}" "${{ inputs.build_type }}" "${{ needs.validate-version.outputs.artifact_version }}" "${{ needs.validate-version.outputs.slugified_version }}" "$GITHUB_WORKSPACE/common-assets" "$GITHUB_WORKSPACE/dist" "$GITHUB_WORKSPACE"

      # Step 8: Upload Final Archive
      - name: Upload Final Archive
        uses: actions/upload-artifact@v7
        with:
          name: openssl-${{ needs.validate-version.outputs.artifact_version }}-${{ matrix.label }}-${{ matrix.arch }}
          path: ${{ env.ARCHIVE_FILE }}
          archive: false
          retention-days: 5

      # Step 9: Upload Build Metadata (Once)
      - name: Upload Build Metadata (Once)
        if: matrix.label == 'Linux' && matrix.arch == 'x64' && needs.validate-version.outputs.is_fork == 'false'
        uses: actions/upload-artifact@v7
        with:
          name: build-metadata
          path: dist/version.txt
          retention-days: 5

  # =========================================================================
  # 5. CLEANUP RAW & INTERMEDIATE ARTIFACTS
  # =========================================================================
  cleanup-artifacts:
    name: Cleanup Intermediate Artifacts
    needs: [package-release, InnoSetup-windows-installer, msix-windows-installers, wix-windows-installers]
    runs-on: ubuntu-latest
    if: |
      always() &&
      inputs.keep_raw_artifacts != true &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')
    permissions:
      actions: write
    steps:
      # Step 1: Checkout Orchestrator Repository
      - name: Checkout Orchestrator Repo
        uses: actions/checkout@v6

      # Step 2: Delete Intermediate Artifacts (raw, slice, common-assets)
      - name: Delete Intermediate Artifacts (raw, slice, common-assets)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash ./scripts/5_cleanup-artifacts_2_delete_artifacts.sh "${{ github.repository }}" "${{ github.run_id }}"
