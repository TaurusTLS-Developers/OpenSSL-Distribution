my %targets = (
    "VC-WIN64-ARM-SHARED" => {
        inherit_from => [ "VC-WIN64-ARM" ],
        disable      => [ "tests", "makedepend", "__DOCS__" ],
        multilib     => "-arm64",
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;                 # Remove Dynamic CRT
            return "$f /MT /Zi";                 # Force Static CRT + Debug Symbols
        },
        lflags       => sub {
            my $f = join(" ", @_);
            return "$f /debug /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
    "VC-WIN64-ARM-STATIC" => {
        inherit_from => [ "VC-WIN64-ARM" ],
        disable      => [ "shared", "module", "tests", "makedepend", "__DOCS__" ],
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            return "$f /MT /Zi";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            return "$f /debug /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
    "VC-ARM64EC-SHARED" => {
        inherit_from => [ "VC-WIN64-ARM" ],
        disable      => [ "asm", "tests", "makedepend", "__DOCS__" ],
        multilib     => "-arm64",
        CFLAGS       => "/W3 /wd4090 /wd4267 /wd4244 /nologo /O1 /Zi",
        ARFLAGS      => "/nologo /MACHINE:ARM64EC",
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            $f =~ s/\/arm64\b//ig;
            return "$f /MT /arm64EC /D_WIN32_WINNT=0x0A00";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MACHINE:ARM64\b//ig;
            return "$f /debug /MACHINE:ARM64EC /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
    "VC-ARM64EC-STATIC" => {
        inherit_from => [ "VC-WIN64-ARM" ],
        disable      => [ "shared", "module", "asm", "tests", "makedepend", "__DOCS__" ],
        CFLAGS       => "/W3 /wd4090 /wd4267 /wd4244 /nologo /O1 /Zi",
        ARFLAGS      => "/nologo /MACHINE:ARM64EC",
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            $f =~ s/\/arm64\b//ig;
            return "$f /MT /arm64EC /D_WIN32_WINNT=0x0A00";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MACHINE:ARM64\b//ig;
            return "$f /debug /MACHINE:ARM64EC /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
);
