my %targets = (
    # =========================================================================
    # 1. x64 HybridCRT Targets (Parallel /Z7)
    # =========================================================================
    "VC-WIN64A-SHARED" => {
        inherit_from => [ "VC-WIN64A" ],
        disable      => [ "tests", "makedepend", "__DOCS__" ],
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            $f =~ s/\/Z[iI]\b//g;
            $f =~ s/\/Fd\S+//g;
            return "$f /MT /Z7";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            return "$f /debug /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
    "VC-WIN64A-STATIC" => {
        inherit_from => [ "VC-WIN64A" ],
        disable      => [ "shared", "module", "tests", "makedepend", "__DOCS__" ],
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            $f =~ s/\/Z[iI]\b//g;
            $f =~ s/\/Fd\S+//g;
            return "$f /MT /Z7";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            return "$f /debug /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },

    # =========================================================================
    # 2. x86 HybridCRT Targets (Parallel /Z7)
    # =========================================================================
    "VC-WIN32-SHARED" => {
        inherit_from => [ "VC-WIN32" ],
        disable      => [ "tests", "makedepend", "__DOCS__" ],
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            $f =~ s/\/Z[iI]\b//g;
            $f =~ s/\/Fd\S+//g;
            return "$f /MT /Z7";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            return "$f /debug /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
    "VC-WIN32-STATIC" => {
        inherit_from => [ "VC-WIN32" ],
        disable      => [ "shared", "module", "tests", "makedepend", "__DOCS__" ],
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            $f =~ s/\/Z[iI]\b//g;
            $f =~ s/\/Fd\S+//g;
            return "$f /MT /Z7";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            return "$f /debug /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },

    # =========================================================================
    # 3. Native ARM64 Targets (multilib => "-arm64", Parallel /Z7)
    # =========================================================================
    "VC-WIN64-ARM-SHARED" => {
        inherit_from => [ "VC-WIN64-ARM" ],
        disable      => [ "tests", "makedepend", "__DOCS__" ],
        multilib     => "-arm64",
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            $f =~ s/\/Z[iI]\b//g;
            $f =~ s/\/Fd\S+//g;
            return "$f /MT /Z7";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            return "$f /debug /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
    "VC-WIN64-ARM-STATIC" => {
        inherit_from => [ "VC-WIN64-ARM" ],
        disable      => [ "shared", "module", "tests", "makedepend", "__DOCS__" ],
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            $f =~ s/\/Z[iI]\b//g;
            $f =~ s/\/Fd\S+//g;
            return "$f /MT /Z7";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            return "$f /debug /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },

    # =========================================================================
    # 4. ARM64EC Targets (multilib => "-arm64", Parallel /Z7)
    # =========================================================================
    "VC-ARM64EC-SHARED" => {
        inherit_from => [ "VC-WIN64-ARM" ],
        disable      => [ "asm", "tests", "makedepend", "__DOCS__" ],
        multilib     => "-arm64",
        CFLAGS       => "/W3 /wd4090 /wd4267 /wd4244 /nologo /O1 /Z7",
        ARFLAGS      => "/nologo /MACHINE:ARM64EC",
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            $f =~ s/\/Z[iI]\b//g;
            $f =~ s/\/Fd\S+//g;
            $f =~ s/\/arm64\b//ig;
            return "$f /MT /arm64EC /D_WIN32_WINNT=0x0A00";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MACHINE:ARM64\b//ig;
            return "$f /debug /MACHINE:ARM64EC /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
    "VC-ARM64EC-STATIC" => {
        inherit_from => [ "VC-WIN64-ARM" ],
        disable      => [ "shared", "module", "asm", "tests", "makedepend", "__DOCS__" ],
        CFLAGS       => "/W3 /wd4090 /wd4267 /wd4244 /nologo /O1 /Z7",
        ARFLAGS      => "/nologo /MACHINE:ARM64EC",
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            $f =~ s/\/Z[iI]\b//g;
            $f =~ s/\/Fd\S+//g;
            $f =~ s/\/arm64\b//ig;
            return "$f /MT /arm64EC /D_WIN32_WINNT=0x0A00";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MACHINE:ARM64\b//ig;
            return "$f /debug /MACHINE:ARM64EC /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
);
