my %targets = (
    # =========================================================================
    # x64 HybridCRT Targets
    # =========================================================================
    "VC-WIN64A-SHARED" => {
        inherit_from => [ "VC-WIN64A" ],
        disable      => [ "tests", "makedepend", "__DOCS__" ],
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;                 # Remove Dynamic CRT
            return "$f /MT /Zi";                 # Force Static CRT + Debug Symbols
        },
        lflags       => sub {
            my $f = join(" ", @_);
            return "$f /debug /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
    "VC-WIN64A-STATIC" => {
        inherit_from => [ "VC-WIN64A" ],
        disable      => [ "shared", "module", "tests", "makedepend", "__DOCS__" ],
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            return "$f /MT /Zi";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            return "$f /debug /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },

    # =========================================================================
    # x86 HybridCRT Targets
    # =========================================================================
    "VC-WIN32-SHARED" => {
        inherit_from => [ "VC-WIN32" ],
        disable      => [ "tests", "makedepend", "__DOCS__" ],
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            return "$f /MT /Zi";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            return "$f /debug /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
    "VC-WIN32-STATIC" => {
        inherit_from => [ "VC-WIN32" ],
        disable      => [ "shared", "module", "tests", "makedepend", "__DOCS__" ],
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            return "$f /MT /Zi";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            return "$f /debug /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },

    # =========================================================================
    # ARM64EC HybridCRT Targets
    # =========================================================================
    "VC-ARM64EC-SHARED" => {
        inherit_from => [ "VC-WIN64-ARM" ],
        disable      => [ "asm", "tests", "makedepend", "__DOCS__" ],
        CFLAGS       => "/W3 /wd4090 /wd4267 /wd4244 /nologo /O1 /Zi",
        ARFLAGS      => "/nologo /MACHINE:ARM64EC",
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;                 # Remove Dynamic CRT
            $f =~ s/\/arm64\b//ig;               # Remove standard ARM64 flag
            return "$f /MT /arm64EC /D_WIN32_WINNT=0x0A00";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MACHINE:ARM64\b//ig;       # Remove conflicting machine type
            return "$f /debug /MACHINE:ARM64EC /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
    "VC-ARM64EC-STATIC" => {
        inherit_from => [ "VC-WIN64-ARM" ],
        disable      => [ "shared", "module", "asm", "tests", "makedepend", "__DOCS__" ],
        CFLAGS       => "/W3 /wd4090 /wd4267 /wd4244 /nologo /O1 /Zi",
        ARFLAGS      => "/nologo /MACHINE:ARM64EC",
        cflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MDd?\b//g;
            $f =~ s/\/arm64\b//ig;
            return "$f /MT /arm64EC /D_WIN32_WINNT=0x0A00";
        },
        lflags       => sub {
            my $f = join(" ", @_);
            $f =~ s/\/MACHINE:ARM64\b//ig;
            return "$f /debug /MACHINE:ARM64EC /NODEFAULTLIB:libucrt.lib /DEFAULTLIB:ucrt.lib";
        },
    },
);
